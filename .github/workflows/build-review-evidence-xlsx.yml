name: Build review evidence Excel

on:
  push:
    branches: [large-corpus-validation-v1]
    paths:
      - "data/review_paper_evidence/BUILD_XLSX_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: large-corpus-validation-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Build complete 55-study workbook
        run: |
          python - <<'PY'
          import csv, os
          from collections import defaultdict
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          OUT="data/review_paper_evidence/SCDA_55_Studies_COMPLETE_All_Fields.xlsx"
          sources={
            "stage2":"data/frozen/stage2_final_manifest_v1.csv",
            "included":"data/frozen/included_studies_v1.csv",
            "primary":"data/frozen/primary_studies_v1.csv",
            "acquisition":"data/frozen/primary_source_acquisition_status_v1.csv",
            "disposition":"data/frozen/primary_production_dispositions_FINAL_v1.csv",
            "claims":"data/frozen/production_claims_FROZEN_v1.csv",
            "adjudication":"data/production_pre_reliability_adjudication_v1.csv",
            "coderb":"data/frozen/coder_b_blinded_sample_FINAL_v1.csv",
          }
          def read(path):
            if not os.path.exists(path): return []
            with open(path,encoding="utf-8-sig",newline="") as f:
              return list(csv.DictReader(f))
          data={k:read(v) for k,v in sources.items()}
          claims=data["claims"]
          study_ids=sorted({r["study_id"] for r in claims})
          assert len(claims)==58, len(claims)
          assert len(study_ids)==55, len(study_ids)

          def key(r):
            return r.get("study_id") or r.get("record_id") or ""
          indexed={}
          for name,rows in data.items():
            d=defaultdict(list)
            for r in rows:
              if key(r): d[key(r)].append(r)
            indexed[name]=d

          # Every field from every repository source is retained with a source prefix.
          fields={}
          for name,rows in data.items():
            seen=[]
            for r in rows:
              for h in r:
                if h not in seen: seen.append(h)
            fields[name]=seen

          headers=["Study_No","study_id"]
          for name in ["stage2","included","primary","acquisition","disposition"]:
            headers += [f"{name}__{h}" for h in fields[name]]
          headers += ["canonical_claim_count"]
          for h in fields["claims"]:
            headers.append(f"claims__{h}")
          headers += ["pre_reliability_adjudication_count"]
          for h in fields["adjudication"]:
            headers.append(f"adjudication__{h}")
          headers += ["coder_b_sample_count"]
          for h in fields["coderb"]:
            headers.append(f"coderb__{h}")

          def agg(rows,h):
            vals=[str(r.get(h,"") or "") for r in rows]
            return " || ".join(vals)

          master=[]
          for i,sid in enumerate(study_ids,1):
            row=[i,sid]
            for name in ["stage2","included","primary","acquisition","disposition"]:
              rr=indexed[name].get(sid,[])
              row += [agg(rr,h) for h in fields[name]]
            cc=indexed["claims"].get(sid,[])
            row += [len(cc)] + [agg(cc,h) for h in fields["claims"]]
            aa=indexed["adjudication"].get(sid,[])
            row += [len(aa)] + [agg(aa,h) for h in fields["adjudication"]]
            bb=indexed["coderb"].get(sid,[])
            row += [len(bb)] + [agg(bb,h) for h in fields["coderb"]]
            master.append(row)

          wb=Workbook()
          ws=wb.active; ws.title="Studies_55_ALL_FIELDS"
          ws.append(headers)
          for r in master: ws.append(r)

          def add_sheet(name,rows):
            sh=wb.create_sheet(name)
            if not rows:
              sh.append(["No rows available"]); return
            hh=[]
            for r in rows:
              for h in r:
                if h not in hh: hh.append(h)
            sh.append(hh)
            for r in rows: sh.append([r.get(h,"") for h in hh])
            style(sh)

          def style(sh):
            fill=PatternFill("solid",fgColor="17365D")
            for c in sh[1]:
              c.font=Font(bold=True,color="FFFFFF"); c.fill=fill
              c.alignment=Alignment(wrap_text=True,vertical="top")
            sh.freeze_panes="C2" if sh.max_column>2 else "A2"
            sh.auto_filter.ref=sh.dimensions
            for col in range(1,sh.max_column+1):
              letter=get_column_letter(col)
              title=str(sh.cell(1,col).value or "")
              width=18
              if any(x in title.lower() for x in ["title","claim_text","abstract","note","rationale","location"]): width=45
              sh.column_dimensions[letter].width=width
            for row in sh.iter_rows(min_row=2):
              for c in row: c.alignment=Alignment(wrap_text=True,vertical="top")

          style(ws)
          add_sheet("Claims_58_CANONICAL",claims)
          for name,label in [
            ("stage2","Stage2_55"),("included","Included_55"),("primary","Primary_55"),
            ("acquisition","Acquisition_55"),("disposition","Disposition_55"),
            ("adjudication","Adjudications"),("coderb","CoderB_Blinded")
          ]:
            subset=[]
            for sid in study_ids: subset.extend(indexed[name].get(sid,[]))
            add_sheet(label,subset)

          dd=wb.create_sheet("Data_Dictionary")
          dd.append(["Prefix","Repository source","Purpose"])
          for n,p in sources.items(): dd.append([n,p,"All available fields retained; no silent imputation."])
          style(dd)

          pr=wb.create_sheet("Provenance")
          pr.append(["Item","Value"])
          pr.append(["Branch","large-corpus-validation-v1"])
          pr.append(["Distinct studies",55])
          pr.append(["Canonical frozen claims",58])
          pr.append(["Generation","Built inside GitHub Actions directly from canonical repository CSVs"])
          pr.append(["Missing values","Preserved as blank; not inferred"])
          style(pr)

          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          wb.save(OUT)
          print(OUT, os.path.getsize(OUT), "bytes", len(master), "studies", len(headers), "master columns")
          PY
      - name: Commit workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review_paper_evidence/SCDA_55_Studies_COMPLETE_All_Fields.xlsx
          git diff --cached --quiet && exit 0
          git commit -m "Add complete 55-study review evidence workbook"
          git push origin large-corpus-validation-v1
