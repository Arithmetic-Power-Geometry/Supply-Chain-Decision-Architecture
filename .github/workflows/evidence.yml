name: Reproducible Evidence

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Run synthetic benchmark
        run: python benchmarks/run_benchmark.py
      - name: Run claim-level calibration
        run: python scripts/run_primary_pilot.py
      - name: Retrieve bounded large-corpus candidate set
        run: |
          python scripts/retrieve_openalex.py --search-id O001 --query "supply chain management" --max-pages 2
          python scripts/retrieve_openalex.py --search-id O002 --query "supply chain" --max-pages 2
          python scripts/retrieve_openalex.py --search-id O003 --query "supply chain decision planning sourcing procurement production inventory logistics coordination disruption risk resilience sustainability" --max-pages 2
          python scripts/retrieve_openalex.py --search-id O004 --query "supply chain optimization simulation analytics forecasting machine learning artificial intelligence digital twin blockchain internet of things autonomous" --max-pages 2
      - name: Validate retrieval provenance
        run: python scripts/validate_retrieval.py
      - name: Build deduplicated candidate corpus
        run: python scripts/build_openalex_candidate_corpus.py
      - name: Assign deterministic stable candidate IDs
        run: python scripts/assign_stable_record_ids.py artifacts/corpus/openalex_candidate_corpus.csv
      - name: Independently verify DOI metadata with Crossref
        run: python scripts/verify_crossref.py artifacts/corpus/openalex_candidate_corpus.csv
      - name: Report candidate-corpus quality
        run: python scripts/report_candidate_quality.py
      - name: Build screening flow when v3 ledger is present
        run: |
          if [ -f data/screening_log_v3.csv ]; then
            python scripts/build_screening_flow.py
          else
            echo "Two-stage screening ledger not yet populated."
          fi
      - name: Validate screening when screening log is present
        run: |
          if [ -f data/screening_log_v2.csv ]; then
            python scripts/validate_screening.py
          else
            echo "Screening log not yet created; retrieval-stage run only."
          fi
      - name: Finalize Reviewer-A Stage-1 screening
        run: python scripts/finalize_stage1.py
      - name: Verify Stage-1 freeze artifacts
        run: |
          python - <<'PY'
          import csv, json
          with open("artifacts/screening/stage1_final_audit.json") as f:
              a=json.load(f)
          assert a["candidate_records"]==705
          assert a["unique_record_ids"]==705
          assert a["adjudications"]==147
          assert a["include"]==659 and a["exclude"]==46 and a["uncertain"]==0
          assert a["stage2_queue"]==659
          with open("artifacts/screening/stage2_queue.csv", newline="", encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==659
          assert len({r["record_id"] for r in rows})==659
          print("Reviewer-A Stage-1 freeze checks passed.")
          PY
      - name: Restore frozen Stage-1 metadata snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/frozen /tmp/scda-freeze
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Arithmetic-Power-Geometry/Supply-Chain-Decision-Architecture/actions/artifacts/11215299923/zip" -o /tmp/scda-freeze/run199.zip
          echo "bbcb768fce87845525e13f3f652271c81568a556f73c1181766eb441b526ea11  /tmp/scda-freeze/run199.zip" | sha256sum -c -
          unzip -p /tmp/scda-freeze/run199.zip artifacts/corpus/openalex_candidate_corpus_stable.csv > data/frozen/stage1_candidate_metadata_v1.csv
          python - <<'PY'
          import csv
          p="data/frozen/stage1_candidate_metadata_v1.csv"
          with open(p,newline="",encoding="utf-8") as f: rows=list(csv.DictReader(f))
          ids={r["record_id"] for r in rows}
          assert len(rows)==705 and len(ids)==705
          assert "SCDA-28ADCDD54D899FD6" in ids
          print("Frozen Stage-1 metadata restored and verified: 705 unique records.")
          PY
      - name: Initialize Stage-2 full-text ledger
        run: python scripts/init_stage2_ledger.py
      - name: Verify Stage-2 ledger initialization
        run: |
          python - <<'PY'
          import csv
          p="artifacts/screening/stage2_screening_ledger.csv"
          with open(p,newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==659
          assert len({r["record_id"] for r in rows})==659
          assert all(r["full_text_status"]=="pending" for r in rows)
          assert all(r["stage2_decision"]=="" for r in rows)
          assert all(r["adjudication_required"]=="yes" for r in rows)
          print("Stage-2 initialization checks passed: 659 unique pending records.")
          PY
      - name: Build deterministic Stage-2 acquisition batches
        run: python scripts/build_stage2_acquisition_batches.py
      - name: Verify Stage-2 acquisition batches
        run: |
          python - <<'PY'
          import csv, glob
          files=sorted(glob.glob("artifacts/screening/stage2_acquisition_batches/B*.csv"))
          rows=[]
          for p in files:
              with open(p,newline="",encoding="utf-8") as f:
                  rows.extend(csv.DictReader(f))
          assert len(files)==27
          assert len(rows)==659
          assert len({r["record_id"] for r in rows})==659
          assert all(r["full_text_status"]=="pending" for r in rows)
          print("Stage-2 acquisition batching passed: 27 batches, 659 unique records.")
          PY
      - name: Initialize Stage-2 Batch-01 execution package
        run: python scripts/init_stage2_batch01.py
      - name: Enrich Stage-2 Batch-01 with bibliographic metadata
        run: python scripts/enrich_stage2_batch01.py
      - name: Verify enriched Batch-01 metadata
        run: |
          python - <<'PY'
          import csv
          p="artifacts/screening/stage2_execution/B01_source_verification_enriched.csv"
          with open(p,newline="",encoding="utf-8") as f: rows=list(csv.DictReader(f))
          assert len(rows)==25 and len({r["record_id"] for r in rows})==25
          assert all(r["title"] for r in rows)
          assert all(not r["eligibility_decision"] for r in rows)
          assert all(r["source_status"]=="pending" for r in rows)
          print("Enriched B01 passed: metadata present; eligibility remains evidence-empty.")
          PY
      - name: Finalize source-supported Stage-2 Batch-01
        run: python scripts/finalize_stage2_b01.py
      - name: Validate finalized Stage-2 Batch-01
        run: python scripts/validate_stage2_batch_evidence.py --input artifacts/screening/stage2_execution/B01_source_verification_final.csv --audit artifacts/screening/stage2_execution/B01_final_evidence_audit.json
      - name: Verify finalized Stage-2 Batch-01 counts
        run: |
          python - <<'PY'
          import csv
          p="artifacts/screening/stage2_execution/B01_source_verification_final.csv"
          with open(p,newline="",encoding="utf-8") as f: rows=list(csv.DictReader(f))
          assert len(rows)==25 and len({r["record_id"] for r in rows})==25
          assert sum(r["eligibility_decision"]=="include" for r in rows)==21
          assert sum(r["eligibility_decision"]=="exclude" for r in rows)==4
          assert all(r["eligibility_decision"] in {"include","exclude"} for r in rows)
          assert all(r["adjudication_required"]=="no" for r in rows)
          print("B01 Reviewer-A evidence closure passed: 21 include, 4 exclude.")
          PY
      - name: Verify Batch-01 starts evidence-empty
        run: |
          python - <<'PY'
          import csv
          p="artifacts/screening/stage2_execution/B01_source_verification.csv"
          with open(p,newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==25 and len({r["record_id"] for r in rows})==25
          assert all(r["source_status"]=="pending" for r in rows)
          assert all(not r["eligibility_decision"] for r in rows)
          assert all(r["adjudication_required"]=="yes" for r in rows)
          print("Batch-01 initialization passed: 25 unique records; no synthetic screening decisions.")
          PY
      - name: Initialize next Stage-2 evidence batches
        run: |
          python scripts/init_stage2_batch.py --batch-id B02 --batch-dir artifacts/screening/stage2_acquisition_batches
          python scripts/init_stage2_batch.py --batch-id B03 --batch-dir artifacts/screening/stage2_acquisition_batches
          python scripts/init_stage2_batch.py --batch-id B04 --batch-dir artifacts/screening/stage2_acquisition_batches
      - name: Verify next Stage-2 batches remain evidence-empty
        run: |
          python - <<'PY'
          import csv
          for bid in ("B02","B03","B04"):
              p=f"artifacts/screening/stage2_execution/{bid}_source_verification_enriched.csv"
              with open(p,newline="",encoding="utf-8") as f: rows=list(csv.DictReader(f))
              assert len(rows)==25 and len({r["record_id"] for r in rows})==25
              assert all(r["title"] and not r["eligibility_decision"] for r in rows)
              assert all(r["source_status"]=="pending" and r["adjudication_required"]=="yes" for r in rows)
          print("B02-B04 ready for parallel source verification; no synthetic decisions.")
          PY
      - name: Finalize and validate Stage-2 B02
        run: |
          python scripts/finalize_stage2_batch.py --base artifacts/screening/stage2_execution/B02_source_verification_enriched.csv --decisions data/screening/stage2_b02_verified_decisions_v1.csv --output artifacts/screening/stage2_execution/B02_source_verification_final.csv
          python scripts/validate_stage2_batch_evidence.py --input artifacts/screening/stage2_execution/B02_source_verification_final.csv --audit artifacts/screening/stage2_execution/B02_final_evidence_audit.json
          python - <<'PY'
          import csv
          p="artifacts/screening/stage2_execution/B02_source_verification_final.csv"
          with open(p,newline="",encoding="utf-8") as f: rows=list(csv.DictReader(f))
          assert len(rows)==25 and len({r["record_id"] for r in rows})==25
          assert sum(r["eligibility_decision"]=="include" for r in rows)==20
          assert sum(r["eligibility_decision"]=="exclude" for r in rows)==5
          assert all(r["adjudication_required"]=="no" for r in rows)
          print("B02 Reviewer-A evidence closure passed: 20 include, 5 exclude.")
          PY
      - name: Finalize and validate Stage-2 B03
        run: |
          python scripts/finalize_stage2_batch.py --base artifacts/screening/stage2_execution/B03_source_verification_enriched.csv --decisions data/screening/stage2_b03_verified_decisions_v1.csv --output artifacts/screening/stage2_execution/B03_source_verification_final.csv
          python scripts/validate_stage2_batch_evidence.py --input artifacts/screening/stage2_execution/B03_source_verification_final.csv --audit artifacts/screening/stage2_execution/B03_final_evidence_audit.json
          python - <<'PY'
          import csv
          p="artifacts/screening/stage2_execution/B03_source_verification_final.csv"
          with open(p,newline="",encoding="utf-8") as f: rows=list(csv.DictReader(f))
          assert len(rows)==25 and len({r["record_id"] for r in rows})==25
          assert sum(r["eligibility_decision"]=="include" for r in rows)==21
          assert sum(r["eligibility_decision"]=="exclude" for r in rows)==4
          assert all(r["adjudication_required"]=="no" for r in rows)
          print("B03 Reviewer-A evidence closure passed: 21 include, 4 exclude.")
          PY
      - name: Finalize and validate Stage-2 B04
        run: |
          python scripts/finalize_stage2_batch.py --base artifacts/screening/stage2_execution/B04_source_verification_enriched.csv --decisions data/screening/stage2_b04_verified_decisions_v1.csv --output artifacts/screening/stage2_execution/B04_source_verification_final.csv
          python scripts/validate_stage2_batch_evidence.py --input artifacts/screening/stage2_execution/B04_source_verification_final.csv --audit artifacts/screening/stage2_execution/B04_final_evidence_audit.json
          python - <<'PY'
          import csv
          p="artifacts/screening/stage2_execution/B04_source_verification_final.csv"
          with open(p,newline="",encoding="utf-8") as f: rows=list(csv.DictReader(f))
          assert len(rows)==25 and len({r["record_id"] for r in rows})==25
          assert sum(r["eligibility_decision"]=="include" for r in rows)==17
          assert sum(r["eligibility_decision"]=="exclude" for r in rows)==8
          assert all(r["adjudication_required"]=="no" for r in rows)
          print("B04 Reviewer-A evidence closure passed: 17 include, 8 exclude.")
          PY
      - name: Restore frozen Stage-1 metadata snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/frozen /tmp/scda-run199
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Arithmetic-Power-Geometry/Supply-Chain-Decision-Architecture/actions/artifacts/11215299923/zip" -o /tmp/scda-run199.zip
          unzip -q /tmp/scda-run199.zip -d /tmp/scda-run199
          cp /tmp/scda-run199/artifacts/corpus/openalex_candidate_corpus_stable.csv artifacts/frozen/stage1_openalex_candidate_corpus_stable_v1.csv
          python scripts/verify_frozen_stage1_metadata.py

      - name: Initialize Stage-2 B05-B08 parallel evidence wave
        run: |
          python scripts/init_stage2_batch.py --batch-id B05 --corpus artifacts/frozen/stage1_openalex_candidate_corpus_stable_v1.csv
          python scripts/init_stage2_batch.py --batch-id B06 --corpus artifacts/frozen/stage1_openalex_candidate_corpus_stable_v1.csv
          python scripts/init_stage2_batch.py --batch-id B07 --corpus artifacts/frozen/stage1_openalex_candidate_corpus_stable_v1.csv
          python scripts/init_stage2_batch.py --batch-id B08 --corpus artifacts/frozen/stage1_openalex_candidate_corpus_stable_v1.csv
          python scripts/verify_stage2_wave.py B05 B06 B07 B08
      - name: Build non-destructive Stage-2 scope audit queue
        run: python scripts/audit_stage2_scope.py
      - name: Prepare blinded Stage-2 reliability sample shell
        run: python scripts/prepare_stage2_reliability_sample.py
      - name: Verify reliability sample shell
        run: |
          python - <<'PY'
          import csv
          with open("artifacts/reliability/stage2_coder_b_sample.csv",newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==132
          assert len({r["record_id"] for r in rows})==132
          assert all(r["coder_b_status"]=="pending" and not r["coder_b_decision"] for r in rows)
          print("Reliability sample shell passed: 132 unique records; no generated coder-B judgments.")
          PY
      - name: Audit Stage-2 acquisition and eligibility status
        run: python scripts/audit_stage2_status.py
      - name: Generate G20 readiness report
        if: always()
        run: python scripts/run_g20_readiness.py
      - name: Validate paper claim map when populated
        run: |
          if [ -f data/paper_claim_map_v1.csv ]; then
            python scripts/validate_paper_claims.py data/paper_claim_map_v1.csv
          else
            echo "Final paper claim map not yet populated; headline claims remain unfrozen."
          fi
      - name: Build provenance graph when frozen corpus is available
        run: |
          if [ -f data/large_corpus_claims_v1.csv ] && [ -f data/screening_log_v3.csv ]; then
            python scripts/build_provenance_graph.py protocol/provenance_jobs_v1.json
          else
            echo "Downstream corpus not yet frozen; final provenance graph remains pending."
          fi
      - name: Report current manuscript mechanics
        continue-on-error: true
        run: python scripts/audit_manuscript_mechanics.py paper/main.tex
      - name: Report current blind-manuscript identity risks
        continue-on-error: true
        run: python scripts/audit_blind_manuscript.py paper/main.tex
      - name: Report current front-matter compliance
        continue-on-error: true
        run: python scripts/audit_frontmatter.py paper/main.tex
      - name: Audit manuscript bibliography integrity
        run: python scripts/audit_references.py paper/main.tex paper/references.bib
      - name: Validate claim provenance when ledger is available
        run: |
          if [ -f data/claim_provenance_v1.csv ]; then
            python scripts/validate_claim_provenance.py data/claim_provenance_v1.csv
          else
            echo "Claim provenance ledger not yet populated; semantic support remains pending."
          fi
      - name: Evaluate managerial decision usefulness when large-corpus claims are available
        run: |
          if [ -f data/large_corpus_claims_v1.csv ]; then
            python scripts/run_managerial_value.py data/large_corpus_claims_v1.csv
          else
            echo "Large-corpus claims not yet frozen; managerial-usefulness conclusions remain pending."
          fi
      - name: Run robustness battery when large-corpus claims are available
        run: |
          if [ -f data/large_corpus_claims_v1.csv ]; then
            python scripts/run_robustness.py data/large_corpus_claims_v1.csv --bootstrap 500
          else
            echo "Large-corpus claims not yet frozen; robustness conclusions remain pending."
          fi
      - name: Test incremental context-layer value when large-corpus claims are available
        run: |
          if [ -f data/large_corpus_claims_v1.csv ]; then
            python scripts/run_context_layer_test.py data/large_corpus_claims_v1.csv
          else
            echo "Large-corpus claims not yet frozen; context-layer value remains untested."
          fi
      - name: Test incremental evidence-layer value when large-corpus claims are available
        run: |
          if [ -f data/large_corpus_claims_v1.csv ]; then
            python scripts/run_evidence_layer_test.py data/large_corpus_claims_v1.csv
          else
            echo "Large-corpus claims not yet frozen; evidence-layer value remains untested."
          fi
      - name: Run generalization tests when large-corpus claims are available
        run: |
          if [ -f data/large_corpus_claims_v1.csv ]; then
            python scripts/run_generalization.py data/large_corpus_claims_v1.csv
          else
            echo "Large-corpus claims not yet frozen; holdout remains unopened."
          fi
      - name: Run frozen model competition when large-corpus claims are available
        run: |
          if [ -f data/large_corpus_claims_v1.csv ]; then
            python scripts/run_model_competition.py data/large_corpus_claims_v1.csv
          else
            echo "Large-corpus claims not yet frozen; no architecture winner is claimed."
          fi
      - name: Compute independent coding reliability when available
        run: |
          if [ -f data/reliability/coder_a_v1.csv ] && [ -f data/reliability/coder_b_v1.csv ]; then
            python scripts/compute_reliability.py data/reliability/coder_a_v1.csv data/reliability/coder_b_v1.csv
          else
            echo "Independent coder files not yet available; no reliability result is claimed."
          fi
      - name: Build artifact manifest
        run: python scripts/build_manifest.py
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: scda-evidence
          path: |
            artifacts/
            data/raw/openalex/*/retrieval_manifest.json
