name: Reproducible Evidence

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test*.py' -v

      - name: Run synthetic benchmark
        run: python benchmarks/run_benchmark.py

      - name: Run claim-level calibration
        run: python scripts/run_primary_pilot.py

      - name: Build artifact manifest
        run: python scripts/build_manifest.py

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: scda-evidence
          path: artifacts/
